# Windows Installers — Corporate MSI + Global/Corporate EXE installers.
#
# Triggered AFTER cargo-dist's release.yml ("Release" workflow) finishes
# publishing the GitHub Release. Uses `workflow_run` (not `release: published`):
# cargo-dist's release.yml creates the GitHub Release via `gh release create`
# using the default GITHUB_TOKEN, and GitHub intentionally suppresses downstream
# workflow firing for events triggered by GITHUB_TOKEN-authenticated actions
# (loop prevention). `workflow_run` is the documented pattern for "fire after
# another workflow completes" and isn't affected by that rule.
#
# Hand-authored workflow — not generated by cargo-dist. We deliberately do NOT
# touch the auto-generated .github/workflows/release.yml beyond its existing
# legacy installer-alias step (permitted by `allow-dirty = ["ci", "msi"]` in
# Cargo.toml's [workspace.metadata.dist]).
#
# ── Tag-triggered (consistent with TR-300) ───────────────────────────────────
# ND-300's release.yml fires on a `vX.Y.Z` TAG push, so a tag-triggered Release
# run has head_branch == the tag name. The auto path filters on
# `startsWith(head_branch, 'v')` and resolves the tag directly from head_branch.
# This file also packages BOTH nd300.exe AND speedqx.exe (ND-300 ships two
# binaries; TR-300 ships one).
#
# Builds three artifacts per release (plus a .sha256 sidecar for each):
#   - nd300-x86_64-pc-windows-msvc-corporate.msi         (perUser MSI, wix-corporate/corporate.wxs)
#   - nd300-x86_64-pc-windows-msvc-setup.exe             (perMachine EXE, inno/global.iss)
#   - nd300-x86_64-pc-windows-msvc-corporate-setup.exe   (perUser EXE, inno/corporate.iss)
# Final release has the cargo-dist base assets (incl. the Global MSI) + these 6.
#
# LOCKSTEP: if install paths or registry-marker values change in wix/*.wxs,
# wix-corporate/*.wxs, or inno/*.iss, update
# src/actions/update.rs::detect_install_origin() to match.

name: Windows Installers

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach installers to (e.g. v3.1.0)"
        required: true
        type: string

permissions:
  contents: write # required for `gh release upload`

jobs:
  build-windows-installers:
    name: Build Corporate MSI + Global EXE + Corporate EXE
    runs-on: windows-2022
    # Filter:
    # - workflow_dispatch path: always run (user provided the tag explicitly).
    # - workflow_run path: only when the tag-triggered Release workflow SUCCEEDED.
    #   ND-300 releases on a `vX.Y.Z` tag push (consistent with TR-300), so a
    #   tag-triggered Release run has head_branch == the tag name, which starts
    #   with 'v'. (Matches TR-300's windows-installers.yml.)
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       startsWith(github.event.workflow_run.head_branch, 'v'))

    steps:
      - name: Enable Windows long paths
        shell: pwsh
        run: git config --global core.longpaths true

      # Check out the exact tagged commit we're building installers for. The auto
      # path is a tag-triggered Release run (head_branch IS the tag, head_sha is
      # the tagged commit); the dispatch path checks out the provided tag.
      - name: Checkout source at trigger commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Resolve target tag
        id: tag
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $tag = "${{ inputs.tag }}"
          } else {
            # Tag-triggered Release run: head_branch IS the tag name (vX.Y.Z).
            $tag = "${{ github.event.workflow_run.head_branch }}"
          }
          if (-not $tag.StartsWith("v")) {
            throw "Expected tag to start with 'v', got '$tag'"
          }
          $version = $tag -replace '^v', ''
          Add-Content -Path $env:GITHUB_OUTPUT -Value "tag=$tag"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$version"
          Write-Host "Tag:     $tag"
          Write-Host "Version: $version"
          Write-Host "Event:   ${{ github.event_name }}"

      - name: Verify upstream release + idempotency check
        id: preflight
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          # Guard against a torn upstream release (cargo-dist's host-job gate
          # tolerates skipped matrix entries, so a partially-failed release can
          # still report conclusion=success). Probe two sentinels that prove the
          # cargo-dist base release is complete:
          #   - dist-manifest.json   cargo-dist's "all phases done" signal
          #   - the Global MSI       the asset our 6 add-ons sit adjacent to
          # Then IDEMPOTENCY: if all 6 corporate/EXE add-ons (+ sidecars) are
          # already attached, log and exit 0 — a no-op main push / docs commit
          # shouldn't rebuild. workflow_dispatch always rebuilds (--clobber).
          $tag = "${{ steps.tag.outputs.tag }}"
          $repo = "${{ github.repository }}"
          Write-Host "Probing release $tag in $repo ..."
          $assets = (gh release view $tag --repo $repo --json assets --jq '.assets[].name') -split "`n"

          $required = @(
            "dist-manifest.json",
            "nd300-x86_64-pc-windows-msvc.msi"
          )
          $missing = @()
          foreach ($r in $required) {
            if ($assets -notcontains $r) { $missing += $r }
          }
          if ($missing.Count -gt 0) {
            Write-Host "Upstream cargo-dist release is incomplete. Missing assets:"
            $missing | ForEach-Object { Write-Host "    $_" }
            Write-Host ""
            Write-Host "This usually means a target build was skipped or failed in release.yml."
            Write-Host "Fix the upstream release (re-run release.yml, or attach the missing assets"
            Write-Host "manually) before re-firing this workflow via:"
            Write-Host "    gh workflow run 'Windows Installers' -f tag=$tag"
            exit 1
          }
          Write-Host "Upstream release looks complete (dist-manifest.json + Global MSI present)."

          $addons = @(
            "nd300-x86_64-pc-windows-msvc-corporate.msi",
            "nd300-x86_64-pc-windows-msvc-corporate.msi.sha256",
            "nd300-x86_64-pc-windows-msvc-setup.exe",
            "nd300-x86_64-pc-windows-msvc-setup.exe.sha256",
            "nd300-x86_64-pc-windows-msvc-corporate-setup.exe",
            "nd300-x86_64-pc-windows-msvc-corporate-setup.exe.sha256"
          )
          $present = ($addons | Where-Object { $assets -contains $_ }).Count
          if ("${{ github.event_name }}" -ne "workflow_dispatch" -and $present -eq $addons.Count) {
            Write-Host "All 6 Windows installer add-ons already attached to $tag — nothing to do (idempotent skip)."
            Add-Content -Path $env:GITHUB_OUTPUT -Value "skip=true"
          } else {
            Write-Host "Building installers ($present/$($addons.Count) add-ons currently attached; dispatch=$('${{ github.event_name }}' -eq 'workflow_dispatch'))."
            Add-Content -Path $env:GITHUB_OUTPUT -Value "skip=false"
          }

      # rust-toolchain.toml (if present) or dtolnay/rust-toolchain@stable gives
      # cargo-wix + Inno Setup a Rust version that matches the repo.
      - name: Set up Rust toolchain
        if: steps.preflight.outputs.skip != 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Build nd300.exe + speedqx.exe (release)
        if: steps.preflight.outputs.skip != 'true'
        shell: pwsh
        run: cargo build --release --locked

      - name: Build Corporate MSI via bare candle + light
        if: steps.preflight.outputs.skip != 'true'
        shell: pwsh
        run: |
          # The Corporate MSI is built with WiX 3 candle/light directly (NOT
          # through cargo-wix). cargo-wix compiles every .wxs in `wix/` and links
          # them into ONE MSI; putting corporate.wxs alongside main.wxs hits
          # LGHT0089/0091/0092 "Multiple entry sections" + "Duplicate symbol"
          # errors. corporate.wxs lives in wix-corporate/ (a separate directory)
          # precisely so cargo-wix's default scan of wix/ produces only the Global
          # MSI cleanly.
          #
          # WiX 3.x is preinstalled on windows-2022 runners; $env:WIX points at
          # the install root ($env:WIX\bin\candle.exe + light.exe).
          #
          # -sice:ICE38 / ICE64 / ICE91 suppress per-user MSI convention
          # violations from light (Components in user-profile dirs wanting HKCU
          # RegistryValue KeyPaths, Directories wanting RemoveFile/RemoveFolder).
          # For our small install they're cosmetic — install/uninstall both work;
          # the only consequence is an empty bin\ folder left after uninstall.
          $candle = "$env:WIX\bin\candle.exe"
          $light  = "$env:WIX\bin\light.exe"
          if (-not (Test-Path $candle)) { throw "candle.exe not found at $candle" }
          if (-not (Test-Path $light))  { throw "light.exe not found at $light" }

          New-Item -ItemType Directory -Force -Path target\wix | Out-Null

          # Quote -d... args. Without quotes, PowerShell parses `-dVersion=3.1.0`
          # as `-dVersion=3` followed by `.1.0` (the dots break tokenization), so
          # candle sees `.1.0` as a source filename and errors CNDL0103. Quoting
          # forces the whole assignment to be one string literal.
          & $candle -arch x64 `
            "-dVersion=${{ steps.tag.outputs.version }}" `
            "-dCargoTargetBinDir=target\release" `
            -out target\wix\corporate.wixobj `
            wix-corporate\corporate.wxs
          if ($LASTEXITCODE -ne 0) { throw "candle failed with exit $LASTEXITCODE" }

          & $light -sice:ICE38 -sice:ICE64 -sice:ICE91 `
            -ext WixUIExtension `
            -out target\wix\nd300-x86_64-pc-windows-msvc-corporate.msi `
            target\wix\corporate.wixobj
          if ($LASTEXITCODE -ne 0) { throw "light failed with exit $LASTEXITCODE" }

          if (-not (Test-Path "target\wix\nd300-x86_64-pc-windows-msvc-corporate.msi")) {
            throw "Corporate MSI build failed — output file missing"
          }
          Write-Host "Corporate MSI built"

      # Chocolatey is preinstalled on windows-2022 runners. Installs Inno Setup 6
      # to C:\Program Files (x86)\Inno Setup 6\.
      - name: Install Inno Setup 6
        if: steps.preflight.outputs.skip != 'true'
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress --no-color
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\iscc.exe")) {
            throw "Inno Setup install failed — iscc.exe missing"
          }
          Write-Host "Inno Setup 6 installed"

      - name: Build Global EXE installer
        if: steps.preflight.outputs.skip != 'true'
        shell: pwsh
        run: |
          # /DMyAppVersion overrides the #define in inno/global.iss so the version
          # embedded in the EXE matches the release tag. Quote the /D... define to
          # survive PowerShell's dot-aware tokenizer (same reason candle args are
          # quoted above).
          & "C:\Program Files (x86)\Inno Setup 6\iscc.exe" "/DMyAppVersion=${{ steps.tag.outputs.version }}" inno\global.iss
          if (-not (Test-Path "inno\Output\nd300-x86_64-pc-windows-msvc-setup.exe")) {
            throw "Global EXE installer build failed — output missing"
          }
          Write-Host "Global EXE installer built"

      - name: Build Corporate EXE installer
        if: steps.preflight.outputs.skip != 'true'
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\iscc.exe" "/DMyAppVersion=${{ steps.tag.outputs.version }}" inno\corporate.iss
          if (-not (Test-Path "inno\Output\nd300-x86_64-pc-windows-msvc-corporate-setup.exe")) {
            throw "Corporate EXE installer build failed — output missing"
          }
          Write-Host "Corporate EXE installer built"

      - name: Compute SHA256 sidecars
        if: steps.preflight.outputs.skip != 'true'
        shell: pwsh
        run: |
          $files = @(
            "target\wix\nd300-x86_64-pc-windows-msvc-corporate.msi",
            "inno\Output\nd300-x86_64-pc-windows-msvc-setup.exe",
            "inno\Output\nd300-x86_64-pc-windows-msvc-corporate-setup.exe"
          )
          foreach ($f in $files) {
            $hash = (Get-FileHash $f -Algorithm SHA256).Hash.ToLower()
            $name = Split-Path $f -Leaf
            # cargo-dist sidecar format: lowercase-hex SHA256, space, asterisk,
            # filename. No trailing newline. Parsed by
            # src/actions/update.rs::parse_sha256_sidecar.
            $line = "$hash *$name"
            [System.IO.File]::WriteAllText("$f.sha256", $line)
            Write-Host "  $name  ->  $hash"
          }

      - name: Upload artifacts to GitHub Release
        if: steps.preflight.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          # --clobber so a re-run can overwrite a partial upload without manually
          # deleting old assets first.
          gh release upload "${{ steps.tag.outputs.tag }}" `
            "target\wix\nd300-x86_64-pc-windows-msvc-corporate.msi" `
            "target\wix\nd300-x86_64-pc-windows-msvc-corporate.msi.sha256" `
            "inno\Output\nd300-x86_64-pc-windows-msvc-setup.exe" `
            "inno\Output\nd300-x86_64-pc-windows-msvc-setup.exe.sha256" `
            "inno\Output\nd300-x86_64-pc-windows-msvc-corporate-setup.exe" `
            "inno\Output\nd300-x86_64-pc-windows-msvc-corporate-setup.exe.sha256" `
            --clobber
          Write-Host "Uploaded 6 assets to ${{ steps.tag.outputs.tag }}"

# Windows Installers — Corporate MSI + Global/Corporate EXE installers.
#
# Called directly by cargo-dist's tag-push Release workflow after it publishes
# the 22 base assets. A reusable workflow is load-bearing here: its GitHub/OIDC
# context remains the tag-push caller, so attestations bind to the exact release
# SHA. A `workflow_run` event would instead use the latest default-branch SHA and
# could race an unrelated main push between the two workflows.
#
# Hand-authored workflow — not generated by cargo-dist. release.yml calls it as
# a reusable workflow; both files are intentionally customized under the
# `allow-dirty = ["ci", "msi"]` cargo-dist policy.
#
# ── Tag-triggered (consistent with TR-300) ───────────────────────────────────
# ND-300's release.yml fires on a `vX.Y.Z` tag push and passes its validated tag
# and source SHA as required workflow_call inputs. Manual repair remains
# available only when dispatched with `--ref <tag>`; the tag/SHA resolver below
# rejects a dispatch whose workflow ref is not the same immutable commit.
# This file also packages BOTH nd300.exe AND speedqx.exe (ND-300 ships two
# binaries; TR-300 ships one).
#
# Builds three artifacts per release (plus a .sha256 sidecar for each):
#   - nd300-x86_64-pc-windows-msvc-corporate.msi         (perUser MSI, wix-corporate/corporate.wxs)
#   - nd300-x86_64-pc-windows-msvc-setup.exe             (perMachine EXE, inno/global.iss)
#   - nd300-x86_64-pc-windows-msvc-corporate-setup.exe   (perUser EXE, inno/corporate.iss)
# Final release has the cargo-dist base assets (incl. the Global MSI) + these 6.
#
# LOCKSTEP: if install paths or registry-marker values change in wix/*.wxs,
# wix-corporate/*.wxs, or inno/*.iss, update
# src/actions/update.rs::detect_install_origin() to match.

name: Windows Installers

on:
  workflow_call:
    inputs:
      tag:
        description: "Validated release tag to attach installers to"
        required: true
        type: string
      source_sha:
        description: "Exact commit SHA validated by the caller Release workflow"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach installers to (e.g. v3.1.0)"
        required: true
        type: string
      validate_only:
        description: "Read-only packaging proof using existing release bytes; never publishes"
        required: false
        default: false
        type: boolean
      source_sha:
        description: "Exact existing release tag commit (required for read-only validation)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  build-windows-installers:
    name: Build Corporate MSI + Global EXE + Corporate EXE
    runs-on: windows-2022
    permissions:
      contents: write # required for `gh release upload`
      id-token: write
      attestations: write
    # A reusable call must retain the tag-push caller ref/SHA and receive that
    # same SHA as an explicit validated input. Manual dispatch is separately
    # bound by the immutable-tag resolver before any source is checked out.
    if: |
      !inputs.validate_only &&
      ((github.event_name == 'workflow_dispatch' && github.ref == format('refs/tags/{0}', inputs.tag)) ||
       (github.event_name == 'push' &&
        startsWith(github.ref, 'refs/tags/v') &&
        inputs.source_sha == github.sha))

    env:
      ND300_TARGET_REPO: ${{ github.repository }}
      ND300_TRIGGER_TAG: ${{ inputs.tag }}
      # Manual repair must be dispatched with `--ref <tag>` so the workflow's
      # own OIDC/source SHA and the checked-out release source remain identical.
      ND300_TRIGGER_SHA: ${{ github.event_name == 'workflow_dispatch' && github.sha || inputs.source_sha }}

    steps:
      - name: Enable Windows long paths
        shell: pwsh
        run: git config --global core.longpaths true

      - name: Resolve and verify immutable release tag
        id: trusted_tag
        shell: pwsh
        run: |
          $tag = $env:ND300_TRIGGER_TAG
          $expectedSha = $env:ND300_TRIGGER_SHA
          if ($tag -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+(?:[-+][0-9A-Za-z.-]+)?$') {
            throw "Refusing unexpected release tag syntax"
          }
          if ($expectedSha -and $expectedSha -notmatch '^[0-9a-fA-F]{40}$') {
            throw "Refusing invalid upstream commit SHA"
          }

          # Resolve both lightweight and annotated tags without checking out or
          # executing any upstream source. Prefer the peeled ^{} commit when it
          # exists, then prove it is the exact SHA that the trusted Release run
          # built.
          $remote = "https://github.com/$env:ND300_TARGET_REPO.git"
          $lines = @(
            git ls-remote --exit-code $remote "refs/tags/$tag" "refs/tags/$tag^{}"
          )
          if ($LASTEXITCODE -ne 0 -or $lines.Count -eq 0) {
            throw "Could not resolve immutable release tag $tag"
          }
          $peeled = $lines | Where-Object { $_ -match [regex]::Escape("refs/tags/$tag^{}") }
          $selected = if ($peeled) { $peeled | Select-Object -First 1 } else { $lines | Select-Object -First 1 }
          $resolvedSha = ($selected -split "`t")[0]
          if ($expectedSha -and $resolvedSha.ToLowerInvariant() -ne $expectedSha.ToLowerInvariant()) {
            throw "Release tag $tag resolves to $resolvedSha, not trusted upstream SHA $expectedSha"
          }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "sha=$resolvedSha"
          Write-Host "Verified immutable tag $tag at commit $resolvedSha"

      # Check out the exact tagged commit we're building installers for. The
      # reusable path receives the Release plan's validated SHA; manual repair
      # derives the expected SHA from its tag-bound workflow ref.
      - name: Checkout source at trigger commit
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.trusted_tag.outputs.sha }}
          persist-credentials: false

      - name: Resolve target tag
        id: tag
        shell: pwsh
        run: |
          $tag = $env:ND300_TRIGGER_TAG
          if ($tag -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+(?:[-+][0-9A-Za-z.-]+)?$') {
            throw "Expected a version tag, got invalid input"
          }
          $version = $tag -replace '^v', ''
          Add-Content -Path $env:GITHUB_OUTPUT -Value "tag=$tag"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$version"
          Write-Host "Tag:     $tag"
          Write-Host "Version: $version"
          Write-Host "Event:   ${{ github.event_name }}"

      - name: Verify upstream release + idempotency check
        id: preflight
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          # Guard against a torn upstream release (cargo-dist's host-job gate
          # tolerates skipped matrix entries, so a partially-failed release can
          # still report conclusion=success). Probe two sentinels that prove the
          # cargo-dist base release is complete:
          #   - dist-manifest.json   cargo-dist's "all phases done" signal
          #   - the Global MSI       the asset our 6 add-ons sit adjacent to
          # Then IDEMPOTENCY: if all 6 corporate/EXE add-ons (+ sidecars) are
          # already attached, log and exit 0 — a no-op main push / docs commit
          # shouldn't rebuild. workflow_dispatch always rebuilds (--clobber).
          $tag = "${{ steps.tag.outputs.tag }}"
          $repo = "${{ github.repository }}"
          Write-Host "Probing release $tag in $repo ..."
          $releaseTarget = gh release view $tag --repo $repo --json targetCommitish --jq '.targetCommitish'
          if ($LASTEXITCODE -ne 0 -or $releaseTarget.ToLowerInvariant() -ne "${{ steps.trusted_tag.outputs.sha }}".ToLowerInvariant()) {
            throw "Release $tag does not target the verified tag commit"
          }
          $assets = (gh release view $tag --repo $repo --json assets --jq '.assets[].name') -split "`n"

          $required = @(
            "dist-manifest.json",
            "nd300-x86_64-pc-windows-msvc.msi"
          )
          $missing = @()
          foreach ($r in $required) {
            if ($assets -notcontains $r) { $missing += $r }
          }
          if ($missing.Count -gt 0) {
            Write-Host "Upstream cargo-dist release is incomplete. Missing assets:"
            $missing | ForEach-Object { Write-Host "    $_" }
            Write-Host ""
            Write-Host "This usually means a target build was skipped or failed in release.yml."
            Write-Host "Fix the upstream release (re-run release.yml, or attach the missing assets"
            Write-Host "manually) before re-firing this workflow via:"
            Write-Host "    gh workflow run 'Windows Installers' --ref $tag -f tag=$tag"
            exit 1
          }
          Write-Host "Upstream release looks complete (dist-manifest.json + Global MSI present)."

          $addons = @(
            "nd300-x86_64-pc-windows-msvc-corporate.msi",
            "nd300-x86_64-pc-windows-msvc-corporate.msi.sha256",
            "nd300-x86_64-pc-windows-msvc-setup.exe",
            "nd300-x86_64-pc-windows-msvc-setup.exe.sha256",
            "nd300-x86_64-pc-windows-msvc-corporate-setup.exe",
            "nd300-x86_64-pc-windows-msvc-corporate-setup.exe.sha256"
          )
          $present = ($addons | Where-Object { $assets -contains $_ }).Count
          if ("${{ github.event_name }}" -ne "workflow_dispatch" -and $present -eq $addons.Count) {
            Write-Host "All 6 Windows installer add-ons already attached to $tag — nothing to do (idempotent skip)."
            Add-Content -Path $env:GITHUB_OUTPUT -Value "skip=true"
          } else {
            Write-Host "Building installers ($present/$($addons.Count) add-ons currently attached; dispatch=$('${{ github.event_name }}' -eq 'workflow_dispatch'))."
            Add-Content -Path $env:GITHUB_OUTPUT -Value "skip=false"
          }

      - name: Acquire and verify exact release Windows binaries
        if: steps.preflight.outputs.skip != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
          RELEASE_SHA: ${{ steps.trusted_tag.outputs.sha }}
        run: ./scripts/prepare-windows-release-binaries.ps1 -Repository $env:ND300_TARGET_REPO -Tag $env:RELEASE_TAG -SourceSha $env:RELEASE_SHA

      - name: Build all Windows installer add-ons from verified release binaries
        if: steps.preflight.outputs.skip != 'true'
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.tag.outputs.version }}
        run: ./scripts/build-windows-addon-installers.ps1 -Version $env:RELEASE_VERSION

      - name: Attest Windows installer add-ons
        if: steps.preflight.outputs.skip != 'true'
        uses: actions/attest@v4
        with:
          subject-path: |
            target/wix/*.msi
            target/wix/*.sha256
            inno/Output/*.exe
            inno/Output/*.sha256

      - name: Upload artifacts to GitHub Release
        if: steps.preflight.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          # --clobber so a re-run can overwrite a partial upload without manually
          # deleting old assets first.
          gh release upload "${{ steps.tag.outputs.tag }}" `
            "target\wix\nd300-x86_64-pc-windows-msvc-corporate.msi" `
            "target\wix\nd300-x86_64-pc-windows-msvc-corporate.msi.sha256" `
            "inno\Output\nd300-x86_64-pc-windows-msvc-setup.exe" `
            "inno\Output\nd300-x86_64-pc-windows-msvc-setup.exe.sha256" `
            "inno\Output\nd300-x86_64-pc-windows-msvc-corporate-setup.exe" `
            "inno\Output\nd300-x86_64-pc-windows-msvc-corporate-setup.exe.sha256" `
            --clobber
          Write-Host "Uploaded 6 assets to ${{ steps.tag.outputs.tag }}"

      - name: Verify complete 28-asset release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $expected = @(
            "dist-manifest.json",
            "nd-300-installer.ps1",
            "nd-300-installer.sh",
            "nd300-aarch64-apple-darwin.tar.xz",
            "nd300-aarch64-apple-darwin.tar.xz.sha256",
            "nd300-aarch64-unknown-linux-gnu.tar.xz",
            "nd300-aarch64-unknown-linux-gnu.tar.xz.sha256",
            "nd300-installer.ps1",
            "nd300-installer.sh",
            "nd300-x86_64-apple-darwin.tar.xz",
            "nd300-x86_64-apple-darwin.tar.xz.sha256",
            "nd300-x86_64-pc-windows-msvc-corporate-setup.exe",
            "nd300-x86_64-pc-windows-msvc-corporate-setup.exe.sha256",
            "nd300-x86_64-pc-windows-msvc-corporate.msi",
            "nd300-x86_64-pc-windows-msvc-corporate.msi.sha256",
            "nd300-x86_64-pc-windows-msvc-setup.exe",
            "nd300-x86_64-pc-windows-msvc-setup.exe.sha256",
            "nd300-x86_64-pc-windows-msvc.msi",
            "nd300-x86_64-pc-windows-msvc.msi.sha256",
            "nd300-x86_64-pc-windows-msvc.zip",
            "nd300-x86_64-pc-windows-msvc.zip.sha256",
            "nd300-x86_64-unknown-linux-gnu.tar.xz",
            "nd300-x86_64-unknown-linux-gnu.tar.xz.sha256",
            "nd300-x86_64-unknown-linux-musl.tar.xz",
            "nd300-x86_64-unknown-linux-musl.tar.xz.sha256",
            "sha256.sum",
            "source.tar.gz",
            "source.tar.gz.sha256"
          ) | Sort-Object

          $actual = @(
            gh release view "${{ steps.tag.outputs.tag }}" `
              --repo "${{ github.repository }}" `
              --json assets `
              --jq '.assets[].name'
          ) | Where-Object { $_ } | Sort-Object
          if ($LASTEXITCODE -ne 0) {
            throw "Could not read the completed GitHub Release asset set"
          }

          $difference = @(Compare-Object -ReferenceObject $expected -DifferenceObject $actual)
          if ($actual.Count -ne 28 -or $difference.Count -ne 0) {
            Write-Host "Expected $($expected.Count) release assets; found $($actual.Count)."
            $difference | Format-Table | Out-String | Write-Host
            throw "Final GitHub Release asset set is incomplete or unexpected"
          }
          Write-Host "Verified the exact 28-asset ND300 release set."

          $downloadDir = Join-Path $env:RUNNER_TEMP "nd300-complete-release"
          New-Item -ItemType Directory -Path $downloadDir -ErrorAction Stop | Out-Null
          gh release download "${{ steps.tag.outputs.tag }}" `
            --repo "${{ github.repository }}" `
            --dir $downloadDir
          if ($LASTEXITCODE -ne 0) { throw "Could not download the complete release for verification" }

          & "$PWD/scripts/verify-release-checksums.ps1" -Directory $downloadDir

          $pending = @(Get-ChildItem -LiteralPath $downloadDir -File | Select-Object -ExpandProperty FullName)
          for ($attempt = 1; $attempt -le 6 -and $pending.Count -gt 0; $attempt++) {
            $stillPending = @()
            foreach ($artifact in $pending) {
              gh attestation verify $artifact `
                --repo "${{ github.repository }}" `
                --signer-repo "${{ github.repository }}" `
                --source-digest "${{ steps.trusted_tag.outputs.sha }}" `
                --format json | Out-Null
              if ($LASTEXITCODE -ne 0) { $stillPending += $artifact }
            }
            $pending = @($stillPending)
            if ($pending.Count -gt 0 -and $attempt -lt 6) {
              Write-Host "Waiting for $($pending.Count) artifact attestation(s) to propagate (attempt $attempt/6)."
              Start-Sleep -Seconds 10
            }
          }
          if ($pending.Count -gt 0) {
            $names = $pending | ForEach-Object { Split-Path $_ -Leaf }
            throw "Missing or invalid exact-source attestations: $($names -join ', ')"
          }
          Write-Host "Verified exact-source GitHub attestations for all 28 release assets."

  validate-packaging:
    name: Read-only exact-release Windows packaging proof
    if: github.event_name == 'workflow_dispatch' && inputs.validate_only
    runs-on: windows-2022
    permissions:
      contents: read
      attestations: read
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_SHA: ${{ inputs.source_sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout candidate packaging tooling
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Checkout exact existing release installer sources
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha }}
          path: release-source
          persist-credentials: false
      - name: Acquire and verify the existing release pair
        shell: pwsh
        run: ./scripts/prepare-windows-release-binaries.ps1 -Repository $env:GITHUB_REPOSITORY -Tag $env:RELEASE_TAG -SourceSha $env:RELEASE_SHA -RepoRoot (Join-Path $env:GITHUB_WORKSPACE 'release-source')
      - name: Build installer add-ons without Rust compilation or publication
        shell: pwsh
        run: ./scripts/build-windows-addon-installers.ps1 -Version ($env:RELEASE_TAG.Substring(1)) -RepoRoot (Join-Path $env:GITHUB_WORKSPACE 'release-source')
      - name: Preserve read-only packaging evidence
        uses: actions/upload-artifact@v6
        with:
          name: windows-packaging-proof-${{ github.run_id }}
          if-no-files-found: error
          path: |
            release-source/target/windows-release-input.json
            release-source/target/wix/*.msi
            release-source/target/wix/*.sha256
            release-source/inno/Output/*.exe
            release-source/inno/Output/*.sha256

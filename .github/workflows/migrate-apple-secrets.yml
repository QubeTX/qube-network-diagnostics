name: Migrate Apple secrets to restricted environment

# Temporary, one-time migration. Delete this workflow after the environment-only
# signing run passes. Only ciphertext encrypted to GitHub's destination public
# key leaves this runner; the key is pinned here rather than supplied by a caller.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  encrypt:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'QubeTX/qube-network-diagnostics' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Prepare the system encryption library before accessing credentials
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libsodium23
      - name: Seal existing values for the apple-signing environment
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_INSTALLER_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_P12_BASE64 }}
          APPLE_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          python3 - <<'PY'
          import base64, ctypes, ctypes.util, json, os
          from pathlib import Path
          names = (
              'APPLE_CERTIFICATE_P12_BASE64', 'APPLE_CERTIFICATE_PASSWORD',
              'APPLE_INSTALLER_CERTIFICATE_P12_BASE64', 'APPLE_INSTALLER_CERTIFICATE_PASSWORD',
              'APPLE_API_KEY_P8_BASE64', 'APPLE_API_KEY_ID', 'APPLE_API_ISSUER_ID',
          )
          public_key = base64.b64decode('p/Qk10vBvyeLKhGLeQSDg6UUkvAEndrlFRjGXe3J9Sg=', validate=True)
          assert len(public_key) == 32
          sodium = ctypes.CDLL(ctypes.util.find_library('sodium'))
          assert sodium.sodium_init() >= 0
          sodium.crypto_box_seal.argtypes = [ctypes.c_void_p, ctypes.c_void_p, ctypes.c_ulonglong, ctypes.c_void_p]
          sodium.crypto_box_seal.restype = ctypes.c_int
          # Prove the ctypes binding with disposable dummy keys before reading
          # any production value. No private test key leaves this process.
          test_public, test_private = ctypes.create_string_buffer(32), ctypes.create_string_buffer(32)
          assert sodium.crypto_box_keypair(test_public, test_private) == 0
          dummy = b'dummy-credential-binding-test'
          sealed = ctypes.create_string_buffer(len(dummy) + 48)
          opened = ctypes.create_string_buffer(len(dummy))
          assert sodium.crypto_box_seal(sealed, dummy, len(dummy), test_public) == 0
          sodium.crypto_box_seal_open.argtypes = [ctypes.c_void_p, ctypes.c_void_p, ctypes.c_ulonglong, ctypes.c_void_p, ctypes.c_void_p]
          assert sodium.crypto_box_seal_open(opened, sealed, len(sealed), test_public, test_private) == 0
          assert opened.raw == dummy
          encrypted = {}
          for name in names:
              value = os.environ[name].encode('utf-8')
              if not value:
                  raise SystemExit(f'Missing repository credential: {name}')
              result = ctypes.create_string_buffer(len(value) + 48)
              if sodium.crypto_box_seal(result, value, len(value), public_key) != 0:
                  raise SystemExit('Encryption failed')
              encrypted[name] = base64.b64encode(result.raw).decode('ascii')
          output = Path(os.environ['RUNNER_TEMP']) / 'apple-secrets-encrypted.json'
          output.write_text(json.dumps({
              'repository': 'QubeTX/qube-network-diagnostics',
              'environment': 'apple-signing', 'key_id': '3380204578043523366',
              'source_sha': os.environ['GITHUB_SHA'], 'run_id': os.environ['GITHUB_RUN_ID'],
              'encrypted_values': encrypted,
          }), encoding='utf-8')
          output.chmod(0o600)
          print('Sealed seven credentials to the pinned GitHub environment public key.')
          PY
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: apple-secrets-encrypted
          path: ${{ runner.temp }}/apple-secrets-encrypted.json
          if-no-files-found: error
          retention-days: 1

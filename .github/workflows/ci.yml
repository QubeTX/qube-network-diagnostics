name: CI

# Cross-platform quality gate for every PR and main-branch push.
#
# Complements the tag-triggered cargo-dist release.yml: this runs fmt / clippy /
# test / release-build on macOS + Linux + Windows at PR time, so cross-platform compile issues —
# cfg-gated code that only fails on one OS, dead-code/unused warnings that are
# platform-specific, test assertions that only hold on one platform — are caught
# BEFORE merge instead of at release. (release.yml's source-check only runs on
# Linux, so those issues used to surface only after tagging.) Mirrors TR-300's
# ci.yml, adapted for ND-300's two binaries (nd300 + speedqx).
#
# Jobs:
#   fmt        — cargo fmt --check (Linux; rustfmt is platform-agnostic)
#   clippy     — strict clippy on Linux, macOS ARM/Intel, and Windows
#   test       — cargo test (Linux glibc + macOS ARM/Intel + Windows)
#   build      — cargo build --release + run both binaries' --version, per OS
#   linux-targets — compile the two non-host Linux release targets before tagging
#   audit      — blocking cargo-audit using the checked-in advisory policy
#   dist-plan  — verify the cargo-dist plan parses (catches dist config errors)
#
# RUSTFLAGS=-D warnings is set globally so the per-OS build/test jobs fail on any
# warning (e.g. dead code that is live on Windows but dead on Linux/macOS) — not
# just clippy on Linux.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Change scope
    uses: ./.github/workflows/change-scope.yml

  apple-policy:
    name: Apple signing policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --disable-pip-version-check PyYAML==6.0.3
      - name: Test change scope, CI evidence, signing sources and release compatibility
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v

  documentation:
    name: Documentation checks
    needs: changes
    if: ${{ needs.changes.outputs.docs_only == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify changed Markdown is text in the proven documentation-only diff
        run: python3 scripts/classify-ci-changes.py --check-docs

  required:
    name: CI required
    needs: [changes, documentation, fmt, clippy, test, build, linux-targets, audit, dist-plan, shellcheck, apple-policy]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require every CI gate to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: python3 scripts/check-ci-results.py

  full-ci:
    name: Full CI
    needs: [changes, required]
    # Override implicit success(): the required gate has an intentionally
    # skipped documentation ancestor on every full run. Still require both
    # direct prerequisites to succeed, and never emit a marker after cancel.
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.required.result == 'success' && needs.changes.outputs.docs_only == 'false' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo 'The complete code and release validation path passed for this source.'

  fmt:
    name: Format
    needs: changes
    if: ${{ needs.changes.outputs.docs_only == 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy (${{ matrix.name }})
    needs: changes
    if: ${{ needs.changes.outputs.docs_only == 'false' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: "Linux x86_64"
          - os: macos-15
            name: "macOS ARM"
          - os: macos-15-intel
            name: "macOS Intel"
          - os: windows-latest
            name: "Windows x86_64"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings

  test:
    name: Test (${{ matrix.name }})
    needs: changes
    if: ${{ needs.changes.outputs.docs_only == 'false' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: "Linux x86_64 glibc"
          - os: macos-15
            name: "macOS ARM"
          - os: macos-15-intel
            name: "macOS Intel"
          - os: windows-latest
            name: "Windows x86_64"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --workspace --all-targets --all-features
      - name: Verify Wi-Fi credentials with the real Linux parser
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends wpasupplicant
          cargo test --locked --lib actions::fix::wpa_config::tests::real_parser_preserves_credentials -- --ignored --nocapture
      - name: Test release checksum verifier
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-release-checksums.ps1
      - name: Test cargo-dist Windows installer hardening
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-harden-cargo-dist-windows-installer.ps1
      - name: Test installer tool download integrity
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-installer-tool-integrity.ps1
      - name: Test exact-release Windows binary preparation
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-windows-release-binaries.ps1
      - name: Test cargo-dist download integrity
        shell: bash
        run: bash scripts/test-cargo-dist-install.sh

  build:
    name: Release Build (${{ matrix.name }})
    needs: changes
    if: ${{ needs.changes.outputs.docs_only == 'false' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: "Linux x86_64 glibc"
          - os: macos-15
            name: "macOS ARM"
          - os: macos-15-intel
            name: "macOS Intel"
          - os: windows-latest
            name: "Windows x86_64"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --release
      - name: Smoke test (both binaries run)
        shell: bash
        run: |
          EXT=""
          [ "${{ runner.os }}" = "Windows" ] && EXT=".exe"
          "./target/release/nd300${EXT}" --version
          "./target/release/speedqx${EXT}" --version
          "./target/release/nd300${EXT}" --help > /dev/null
          "./target/release/speedqx${EXT}" --help > /dev/null
      - name: Read-only macOS diagnostic JSON smoke
        if: runner.os == 'macOS'
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import subprocess

          for args in (["--fast", "--json"], ["-t", "--fast", "--json"]):
              result = subprocess.run(
                  ["./target/release/nd300", *args],
                  capture_output=True,
                  text=True,
                  timeout=180,
              )
              if result.returncode not in (0, 1, 2):
                  raise SystemExit(
                      f"nd300 {' '.join(args)} exited {result.returncode}: {result.stderr}"
                  )
              payload = json.loads(result.stdout)
              for key in ("timestamp", "interfaces", "interface_details"):
                  if key not in payload:
                      raise SystemExit(f"missing JSON key {key!r} for {' '.join(args)}")
          PY

  linux-targets:
    name: Release Target Compile (${{ matrix.name }})
    needs: changes
    if: ${{ needs.changes.outputs.docs_only == 'false' }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux aarch64 GNU
            target: aarch64-unknown-linux-gnu
            # --no-install-recommends omits the target libc headers that GCC's
            # stdint.h needs while compiling ring/lzma C sources, so request
            # the cross libc development package explicitly.
            packages: gcc-aarch64-linux-gnu libc6-dev-arm64-cross
            cc: aarch64-linux-gnu-gcc
            ar: aarch64-linux-gnu-ar
          - name: Linux x86_64 musl
            target: x86_64-unknown-linux-musl
            packages: musl-tools
            cc: musl-gcc
            ar: ar
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: ${{ matrix.target }}
      - name: Install cross toolchain
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ${{ matrix.packages }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Compile release target
        shell: bash
        env:
          CARGO_BUILD_TARGET: ${{ matrix.target }}
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CC_aarch64_unknown_linux_gnu: ${{ matrix.cc }}
          AR_aarch64_unknown_linux_gnu: ${{ matrix.ar }}
          CC_x86_64_unknown_linux_musl: ${{ matrix.cc }}
          AR_x86_64_unknown_linux_musl: ${{ matrix.ar }}
        run: cargo build --locked --release --workspace --bins

  audit:
    name: Security audit
    needs: changes
    if: ${{ needs.changes.outputs.docs_only == 'false' }}
    runs-on: ubuntu-latest
    env:
      CARGO_AUDIT_VERSION: '0.23.0'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
      - name: Restore exact cargo-audit executable
        id: cargo_audit_cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/nd300-cargo-audit/bin/cargo-audit
          key: cargo-audit-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.CARGO_AUDIT_VERSION }}-rust-1.97.0
      - name: Install and verify pinned cargo-audit
        shell: bash
        env:
          EXACT_CACHE_HIT: ${{ steps.cargo_audit_cache.outputs.cache-hit }}
        run: bash scripts/ensure-cargo-audit.sh "$CARGO_AUDIT_VERSION" "$RUNNER_TEMP/nd300-cargo-audit" "$EXACT_CACHE_HIT"
      - name: Audit with freshly fetched advisory data
        shell: bash
        run: '"$RUNNER_TEMP/nd300-cargo-audit/bin/cargo-audit" audit'

  dist-plan:
    name: cargo-dist plan
    needs: changes
    if: ${{ needs.changes.outputs.docs_only == 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install verified cargo-dist v0.31.0
        shell: bash
        run: bash scripts/install-cargo-dist.sh
      - name: Verify dist plan parses
        shell: bash
        run: |
          ~/.cargo/bin/dist plan --output-format=json > dist-plan.json
          if grep -q 'macos-14' dist-plan.json; then
            echo "cargo-dist still selected the retiring macos-14 runner" >&2
            exit 1
          fi
          grep -q 'macos-15' dist-plan.json

  shellcheck:
    name: ShellCheck release scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck -x scripts/*.sh
      - name: Test cargo-audit executable caching
        shell: bash
        run: bash scripts/test-cargo-audit-cache.sh
      - name: Test macOS release metadata parser
        shell: bash
        run: bash scripts/test-macos-release-parsers.sh
      - name: Enforce macOS runner Bash 3 compatibility
        shell: bash
        run: |
          # GitHub's macOS runner invokes the system Bash 3.2. Reject the
          # common Bash-4-only constructs that would fail only after tagging.
          if grep -En '(^|[[:space:]])declare[[:space:]]+-A|(^|[[:space:]])(mapfile|readarray)([[:space:]]|$)' scripts/*.sh; then
            echo "Bash-4-only syntax is not allowed in macOS release scripts" >&2
            exit 1
          fi
